
name: Build PiSLA Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'PiSLA-Desktop-v1.6.0.zip'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: ''

      - name: Verify desktop ZIP
        shell: pwsh
        run: |
          $zip = "PiSLA-Desktop-v1.6.0.zip"

          if (!(Test-Path $zip)) {
            Write-Error "Desktop ZIP not found in repository root."
            Get-ChildItem
            exit 1
          }

      - name: Extract desktop project
        shell: pwsh
        run: |
          Expand-Archive `
            -LiteralPath "PiSLA-Desktop-v1.6.0.zip" `
            -DestinationPath "extracted" `
            -Force

          $project = "extracted/PiSLA-Desktop"

          if (!(Test-Path "$project/package.json")) {
            Write-Error "package.json not found in expected project folder."
            Get-ChildItem extracted -Recurse
            exit 1
          }

          $config = Get-Content "$project/package.json" -Raw |
            ConvertFrom-Json

          if ($config.name -ne "pisla-desktop") {
            Write-Error "Unexpected desktop project package."
            exit 1
          }

      - name: Install dependencies
        working-directory: extracted/PiSLA-Desktop
        run: npm install --no-audit --no-fund

      - name: Build Windows installer and portable EXE
        working-directory: extracted/PiSLA-Desktop
        run: npm run dist

      - name: Verify EXE files
        shell: pwsh
        run: |
          $files = Get-ChildItem `
            "extracted/PiSLA-Desktop/release" `
            -Filter "*.exe" `
            -File

          if (!$files -or $files.Count -lt 1) {
            Write-Error "No EXE files were generated."
            Get-ChildItem "extracted/PiSLA-Desktop/release" -Recurse
            exit 1
          }

          $files | Select-Object Name, Length

      - name: Upload Windows EXE files
        uses: actions/upload-artifact@v4
        with:
          name: PiSLA-Windows-v1.6.0
          path: extracted/PiSLA-Desktop/release/*.exe
          if-no-files-found: error
          retention-days: 7
