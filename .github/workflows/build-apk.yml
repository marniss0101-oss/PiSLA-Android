
name: Build PiSLA APK from uploaded ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'PiSLA-Android-Project-v1.6.0.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project ZIP exists
        run: |
          test -f PiSLA-Android-Project-v1.6.0.zip
          unzip -t PiSLA-Android-Project-v1.6.0.zip

      - name: Extract Android project
        run: unzip -q PiSLA-Android-Project-v1.6.0.zip -d extracted

      - name: Verify Android project files
        run: |
          test -f extracted/PiSLA-Android/settings.gradle || test -f extracted/PiSLA-Android/settings.gradle.kts
          test -f extracted/PiSLA-Android/app/build.gradle || test -f extracted/PiSLA-Android/app/build.gradle.kts

      - name: Build debug APK
        working-directory: extracted/PiSLA-Android
        run: gradle assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiSLA-Android-APK
          path: extracted/PiSLA-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
