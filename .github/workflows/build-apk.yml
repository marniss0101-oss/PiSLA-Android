
name: Build PiSLA Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build PiSLA Android v1.8.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER=""

          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/15.0/bin/sdkmanager" \
            "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager -perm -111 \
              2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK manager was not found."
            find "$ANDROID_HOME" -maxdepth 4 -type f \
              -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          yes | "$SDKMANAGER" --licenses

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify build environment
        shell: bash
        run: |
          java -version
          gradle --version
          "$SDKMANAGER" --list_installed

      - name: Build PiSLA APK
        shell: bash
        run: |
          gradle assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload PiSLA APK
        uses: actions/upload-artifact@v4
        with:
          name: PiSLA-Android-APK-v1.8.1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
