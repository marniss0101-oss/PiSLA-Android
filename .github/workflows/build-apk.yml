
name: Build PiSLA APK from uploaded ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'PiSLA-Android-Project-v1.6.0.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --licenses

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify and extract outer ZIP
        shell: bash
        run: |
          ZIP_FILE="PiSLA-Android-Project-v1.6.0.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Required ZIP is missing from repository root."
            ls -la
            exit 1
          fi

          unzip -t "$ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Locate and extract Android project
        id: locate
        shell: bash
        run: |
          PROJECT_DIR=""

          # Case 1: The outer ZIP already contains the Android project.
          SETTINGS_FILE="$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          else
            # Case 2: The outer ZIP contains another project ZIP.
            INNER_ZIP="$(find extracted -type f \
              -name 'PiSLA-Android-Project-v1.6.0.zip' \
              -print -quit)"

            if [ -z "$INNER_ZIP" ]; then
              echo "ERROR: No Gradle settings file or nested project ZIP found."
              echo "Extracted files:"
              find extracted -maxdepth 6 -type f
              exit 1
            fi

            mkdir -p android-project
            unzip -t "$INNER_ZIP"
            unzip -q "$INNER_ZIP" -d android-project

            SETTINGS_FILE="$(find android-project -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit)"

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: Nested ZIP does not contain a Gradle settings file."
              echo "Extracted files:"
              find android-project -maxdepth 6 -type f
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          # Verify the Android app module exists.
          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle or app/build.gradle.kts was not found."
            echo "Project directory: $PROJECT_DIR"
            find "$PROJECT_DIR" -maxdepth 5 -type f
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project located at: $PROJECT_DIR"

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          gradle assembleDebug

          APK_FILE="$(find app/build/outputs/apk/debug \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Build finished but no debug APK was found."
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          cp "$APK_FILE" "$GITHUB_WORKSPACE/app-debug.apk"
          echo "APK created successfully."

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiSLA-Android-APK
          path: app-debug.apk
          if-no-files-found: error
          retention-days: 7
