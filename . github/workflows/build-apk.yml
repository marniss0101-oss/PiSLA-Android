
name: Build PiSLA APK from uploaded ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'PiSLA-Android-Project-v1.6.0.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project ZIP exists
        shell: bash
        run: |
          if [ ! -f "PiSLA-Android-Project-v1.6.0.zip" ]; then
            echo "ERROR: PiSLA-Android-Project-v1.6.0.zip was not found in the repository root."
            echo "Repository files:"
            ls -la
            exit 1
          fi

          unzip -t PiSLA-Android-Project-v1.6.0.zip

      - name: Extract Android project
        run: unzip -q PiSLA-Android-Project-v1.6.0.zip -d extracted

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          SETTINGS_FILE="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found in the ZIP."
            echo "Files extracted:"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: App Gradle file not found in $PROJECT_DIR/app"
            echo "Project files:"
            find "$PROJECT_DIR" -maxdepth 4 -type f
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found at: $PROJECT_DIR"

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          gradle assembleDebug

          APK_FILE="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            echo "Build output files:"
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          cp "$APK_FILE" "$GITHUB_WORKSPACE/app-debug.apk"
          echo "APK successfully generated."

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiSLA-Android-APK
          path: app-debug.apk
          if-no-files-found: error
